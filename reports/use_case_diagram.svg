<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .system { fill: #ffffff; stroke: #1f4e79; stroke-width: 3; }
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #17365d; }
      .label { font-family: Arial, sans-serif; font-size: 18px; fill: #1f2937; }
      .actor-label { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .usecase { fill: #eaf3ff; stroke: #2f75b5; stroke-width: 2; }
      .admin-usecase { fill: #eaf7ef; stroke: #2e7d32; stroke-width: 2; }
      .external-usecase { fill: #fff4e5; stroke: #c77700; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
      .note { font-family: Arial, sans-serif; font-size: 15px; fill: #475569; }
      .small { font-family: Arial, sans-serif; font-size: 16px; fill: #1f2937; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <text class="title" x="700" y="55" text-anchor="middle">Use Case Diagram - Currency Exchange Rate Prediction System</text>

  <rect class="system" x="330" y="95" width="740" height="720" rx="18"/>
  <text class="title" x="700" y="135" text-anchor="middle" font-size="24">Currency Exchange Rate Prediction System</text>

  <!-- User Actor -->
  <circle cx="150" cy="210" r="28" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <line class="line" x1="150" y1="238" x2="150" y2="330"/>
  <line class="line" x1="95" y1="275" x2="205" y2="275"/>
  <line class="line" x1="150" y1="330" x2="105" y2="405"/>
  <line class="line" x1="150" y1="330" x2="195" y2="405"/>
  <text class="actor-label" x="150" y="445" text-anchor="middle">User</text>

  <!-- Admin Actor -->
  <circle cx="1250" cy="200" r="28" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <line class="line" x1="1250" y1="228" x2="1250" y2="320"/>
  <line class="line" x1="1195" y1="265" x2="1305" y2="265"/>
  <line class="line" x1="1250" y1="320" x2="1205" y2="395"/>
  <line class="line" x1="1250" y1="320" x2="1295" y2="395"/>
  <text class="actor-label" x="1250" y="435" text-anchor="middle">Admin / Developer</text>

  <!-- External API Actor -->
  <rect x="1175" y="610" width="150" height="95" rx="12" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text class="actor-label" x="1250" y="648" text-anchor="middle">External</text>
  <text class="actor-label" x="1250" y="676" text-anchor="middle">Exchange API</text>

  <!-- User use cases -->
  <ellipse class="usecase" cx="520" cy="205" rx="150" ry="36"/>
  <text class="label" x="520" y="211" text-anchor="middle">Select Currency</text>

  <ellipse class="usecase" cx="520" cy="295" rx="160" ry="36"/>
  <text class="label" x="520" y="301" text-anchor="middle">View Latest Rate</text>

  <ellipse class="usecase" cx="520" cy="385" rx="175" ry="36"/>
  <text class="label" x="520" y="391" text-anchor="middle">View Historical Trend</text>

  <ellipse class="usecase" cx="520" cy="475" rx="175" ry="36"/>
  <text class="label" x="520" y="481" text-anchor="middle">Generate Forecast</text>

  <ellipse class="usecase" cx="520" cy="565" rx="185" ry="36"/>
  <text class="label" x="520" y="571" text-anchor="middle">Compare Model Results</text>

  <ellipse class="usecase" cx="520" cy="655" rx="160" ry="36"/>
  <text class="label" x="520" y="661" text-anchor="middle">Download Forecast CSV</text>

  <ellipse class="usecase" cx="520" cy="745" rx="150" ry="36"/>
  <text class="label" x="520" y="751" text-anchor="middle">Convert Currency</text>

  <!-- API use case -->
  <ellipse class="usecase" cx="850" cy="670" rx="160" ry="36"/>
  <text class="label" x="850" y="676" text-anchor="middle">Access Prediction API</text>

  <!-- Admin use cases -->
  <ellipse class="admin-usecase" cx="850" cy="220" rx="155" ry="36"/>
  <text class="label" x="850" y="226" text-anchor="middle">Collect Data</text>

  <ellipse class="admin-usecase" cx="850" cy="310" rx="160" ry="36"/>
  <text class="label" x="850" y="316" text-anchor="middle">Preprocess Data</text>

  <ellipse class="admin-usecase" cx="850" cy="400" rx="175" ry="36"/>
  <text class="label" x="850" y="406" text-anchor="middle">Train ML Models</text>

  <ellipse class="admin-usecase" cx="850" cy="490" rx="175" ry="36"/>
  <text class="label" x="850" y="496" text-anchor="middle">Evaluate Models</text>

  <ellipse class="admin-usecase" cx="850" cy="580" rx="160" ry="36"/>
  <text class="label" x="850" y="586" text-anchor="middle">Save Trained Models</text>

  <!-- Lines from User -->
  <line class="line" x1="205" y1="255" x2="374" y2="205"/>
  <line class="line" x1="205" y1="275" x2="365" y2="295"/>
  <line class="line" x1="205" y1="295" x2="352" y2="385"/>
  <line class="line" x1="205" y1="315" x2="350" y2="475"/>
  <line class="line" x1="205" y1="335" x2="350" y2="565"/>
  <line class="line" x1="195" y1="365" x2="370" y2="655"/>
  <line class="line" x1="185" y1="392" x2="380" y2="745"/>
  <line class="line" x1="205" y1="345" x2="695" y2="670"/>

  <!-- Lines from Admin -->
  <line class="line" x1="1195" y1="245" x2="1000" y2="220"/>
  <line class="line" x1="1195" y1="265" x2="1005" y2="310"/>
  <line class="line" x1="1195" y1="290" x2="1015" y2="400"/>
  <line class="line" x1="1195" y1="325" x2="1010" y2="490"/>
  <line class="line" x1="1195" y1="360" x2="1005" y2="580"/>

  <!-- External API lines -->
  <line class="line" x1="1175" y1="650" x2="1005" y2="580"/>
  <line class="line" x1="1175" y1="675" x2="665" y2="745"/>
  <line class="line" x1="1175" y1="625" x2="675" y2="295"/>

  <!-- Relationships -->
  <path class="dash" d="M 650 475 C 720 470, 760 445, 810 400"/>
  <text class="note" x="718" y="448" text-anchor="middle">&lt;&lt;uses trained model&gt;&gt;</text>

  <path class="dash" d="M 670 565 C 730 570, 765 580, 810 580"/>
  <text class="note" x="735" y="603" text-anchor="middle">&lt;&lt;loads model metrics&gt;&gt;</text>

  <path class="dash" d="M 690 670 C 645 630, 612 575, 560 510"/>
  <text class="note" x="690" y="630" text-anchor="middle">&lt;&lt;provides forecast&gt;&gt;</text>

  <!-- Legend -->
  <rect x="80" y="770" width="230" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse class="usecase" cx="115" cy="800" rx="22" ry="12"/>
  <text class="small" x="150" y="806">User Functions</text>
  <ellipse class="admin-usecase" cx="115" cy="830" rx="22" ry="12"/>
  <text class="small" x="150" y="836">Admin Functions</text>
  <line class="dash" x1="93" y1="854" x2="137" y2="854"/>
  <text class="small" x="150" y="860">Use Case Relation</text>
</svg>
