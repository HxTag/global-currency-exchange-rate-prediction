<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #17365d; }
      .start { fill: #111827; stroke: #111827; stroke-width: 2; }
      .process { fill: #eaf3ff; stroke: #2f75b5; stroke-width: 2.5; }
      .ml { fill: #eaf7ef; stroke: #2e7d32; stroke-width: 2.5; }
      .data { fill: #f4ecff; stroke: #6f42c1; stroke-width: 2.5; }
      .decision { fill: #fff4e5; stroke: #c77700; stroke-width: 2.5; }
      .output { fill: #fff8dc; stroke: #b8860b; stroke-width: 2.5; }
      .text { font-family: Arial, sans-serif; font-size: 19px; fill: #1f2937; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow2); }
      .label { font-family: Arial, sans-serif; font-size: 15px; fill: #334155; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#334155"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="1550"/>
  <text class="title" x="600" y="55" text-anchor="middle">Flowchart - Currency Exchange Rate Prediction System</text>

  <!-- Start -->
  <rect class="process" x="420" y="95" width="360" height="70" rx="35"/>
  <text class="text" x="600" y="138" text-anchor="middle">Start</text>

  <!-- Data collection -->
  <rect class="process" x="380" y="215" width="440" height="75" rx="18"/>
  <text class="text" x="600" y="246" text-anchor="middle">Collect Historical Exchange Rate Data</text>
  <text class="small" x="600" y="270" text-anchor="middle">EUR, INR, GBP, JPY, AUD against USD</text>

  <path class="dash" d="M820 252 L970 252"/>
  <path class="data" d="M970 215 L1110 215 L1075 290 L935 290 Z"/>
  <text class="text" x="1022" y="248" text-anchor="middle">Raw CSV</text>
  <text class="small" x="1022" y="270" text-anchor="middle">Dataset</text>

  <!-- Preprocess -->
  <rect class="ml" x="380" y="340" width="440" height="75" rx="18"/>
  <text class="text" x="600" y="371" text-anchor="middle">Preprocess Data</text>
  <text class="small" x="600" y="395" text-anchor="middle">clean data, handle dates, prepare records</text>

  <!-- Feature engineering -->
  <rect class="ml" x="350" y="465" width="500" height="90" rx="18"/>
  <text class="text" x="600" y="497" text-anchor="middle">Create Time-Series Features</text>
  <text class="small" x="600" y="522" text-anchor="middle">lag values, moving averages, returns, momentum,</text>
  <text class="small" x="600" y="545" text-anchor="middle">volatility, day of week, month, year</text>

  <path class="dash" d="M850 510 L970 510"/>
  <path class="data" d="M970 465 L1110 465 L1075 555 L935 555 Z"/>
  <text class="text" x="1022" y="505" text-anchor="middle">Processed</text>
  <text class="small" x="1022" y="528" text-anchor="middle">Dataset</text>

  <!-- Split -->
  <rect class="ml" x="380" y="610" width="440" height="75" rx="18"/>
  <text class="text" x="600" y="641" text-anchor="middle">Split Data into Training and Testing Sets</text>
  <text class="small" x="600" y="665" text-anchor="middle">time order preserved without shuffling</text>

  <!-- Train -->
  <rect class="ml" x="380" y="735" width="440" height="90" rx="18"/>
  <text class="text" x="600" y="767" text-anchor="middle">Train Machine Learning Models</text>
  <text class="small" x="600" y="792" text-anchor="middle">XGBoost Regressor as main model</text>
  <text class="small" x="600" y="815" text-anchor="middle">Random Forest as baseline model</text>

  <!-- Evaluate -->
  <rect class="ml" x="380" y="875" width="440" height="75" rx="18"/>
  <text class="text" x="600" y="906" text-anchor="middle">Evaluate Model Performance</text>
  <text class="small" x="600" y="930" text-anchor="middle">MAE, RMSE, and MAPE</text>

  <!-- Decision -->
  <polygon class="decision" points="600,1000 790,1080 600,1160 410,1080"/>
  <text class="text" x="600" y="1062" text-anchor="middle">Is Model</text>
  <text class="text" x="600" y="1088" text-anchor="middle">Ready for</text>
  <text class="text" x="600" y="1114" text-anchor="middle">Prediction?</text>

  <!-- Loop back -->
  <path class="line" d="M410 1080 C230 1080, 230 510, 350 510"/>
  <text class="label" x="265" y="790" text-anchor="middle">No</text>
  <text class="small" x="245" y="820" text-anchor="middle">improve features</text>
  <text class="small" x="245" y="842" text-anchor="middle">or retrain</text>

  <!-- Save -->
  <rect class="data" x="380" y="1210" width="440" height="80" rx="18"/>
  <text class="text" x="600" y="1242" text-anchor="middle">Save Trained Models and Metrics</text>
  <text class="small" x="600" y="1267" text-anchor="middle">.pkl model files and model_metrics.csv</text>

  <!-- User access decision -->
  <polygon class="decision" points="600,1340 790,1420 600,1500 410,1420"/>
  <text class="text" x="600" y="1402" text-anchor="middle">User Selects</text>
  <text class="text" x="600" y="1428" text-anchor="middle">Dashboard or</text>
  <text class="text" x="600" y="1454" text-anchor="middle">API?</text>

  <!-- Dashboard path left -->
  <rect class="process" x="70" y="1310" width="290" height="75" rx="18"/>
  <text class="text" x="215" y="1341" text-anchor="middle">Open Streamlit Dashboard</text>
  <text class="small" x="215" y="1365" text-anchor="middle">select currency and days</text>

  <rect class="process" x="70" y="1440" width="290" height="75" rx="18"/>
  <text class="text" x="215" y="1471" text-anchor="middle">Generate Forecast</text>
  <text class="small" x="215" y="1495" text-anchor="middle">view charts and comparison</text>

  <!-- API path right -->
  <rect class="process" x="840" y="1310" width="290" height="75" rx="18"/>
  <text class="text" x="985" y="1341" text-anchor="middle">Call FastAPI Endpoint</text>
  <text class="small" x="985" y="1365" text-anchor="middle">/predict/{currency}</text>

  <rect class="process" x="840" y="1440" width="290" height="75" rx="18"/>
  <text class="text" x="985" y="1471" text-anchor="middle">Return JSON Forecast</text>
  <text class="small" x="985" y="1495" text-anchor="middle">date and predicted rate</text>

  <!-- Main flow arrows -->
  <path class="line" d="M600 165 L600 215"/>
  <path class="line" d="M600 290 L600 340"/>
  <path class="line" d="M600 415 L600 465"/>
  <path class="line" d="M600 555 L600 610"/>
  <path class="line" d="M600 685 L600 735"/>
  <path class="line" d="M600 825 L600 875"/>
  <path class="line" d="M600 950 L600 1000"/>
  <path class="line" d="M600 1160 L600 1210"/>
  <text class="label" x="635" y="1186">Yes</text>
  <path class="line" d="M600 1290 L600 1340"/>

  <!-- Branches -->
  <path class="line" d="M410 1420 L360 1348"/>
  <text class="label" x="365" y="1395">Dashboard</text>
  <path class="line" d="M790 1420 L840 1348"/>
  <text class="label" x="835" y="1395">API</text>
  <path class="line" d="M215 1385 L215 1440"/>
  <path class="line" d="M985 1385 L985 1440"/>

  <!-- Currency conversion side flow -->
  <rect class="output" x="70" y="1085" width="290" height="75" rx="18"/>
  <text class="text" x="215" y="1116" text-anchor="middle">Currency Converter</text>
  <text class="small" x="215" y="1140" text-anchor="middle">fetch latest live rate</text>
  <path class="dash" d="M360 1122 L430 1122"/>
  <text class="small" x="215" y="1200" text-anchor="middle">Optional dashboard feature</text>

  <!-- Legend -->
  <rect x="875" y="675" width="250" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect class="process" x="900" y="700" width="42" height="24" rx="8"/>
  <text class="small" x="960" y="718">Process</text>
  <rect class="ml" x="900" y="735" width="42" height="24" rx="8"/>
  <text class="small" x="960" y="753">ML Step</text>
  <path class="data" d="M900 770 L948 770 L938 795 L890 795 Z"/>
  <text class="small" x="960" y="789">Data / File</text>
  <polygon class="decision" points="921,810 948,825 921,840 894,825"/>
  <text class="small" x="960" y="830">Decision</text>
</svg>
